<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="Your flexible, private fitness journal.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>FitnessLog</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">YOUR TRAINING JOURNAL</div><h1 id="page-title">Home</h1></div>
      <button id="settings-button" class="icon-button" aria-label="Settings">⚙</button>
    </header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Main navigation">
      <button data-tab="home" class="active"><span aria-hidden="true">⌂</span>Home</button>
      <button data-tab="history"><span aria-hidden="true">▤</span>History</button>
      <button data-tab="progress"><span aria-hidden="true">▥</span>Progress</button>
      <button data-tab="library"><span aria-hidden="true">▦</span>Library</button>
    </nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
